<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thank-you-card {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 60px;
            color: #4BB543;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .close-btn {
            display: inline-block;
            background: #4BB543;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

            .close-btn:hover {
                background: #3da436;
            }

        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <div class="success-icon">&#10003;</div>
        <h1 id="thankTitle">Thank You!</h1>
        <p id="thankMessage">Your message has been successfully sent. We will get back to you shortly.</p>
        <a href="#" class="close-btn" id="closeBtn">Close</a>
        <div class="note">You can now close this tab.</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Retrieve form data from sessionStorage
            const name = sessionStorage.getItem('name') || '';

            // Update personalized messager
            if (name) {
                document.getElementById('thankTitle').innerText = `Thank You, ${name}!`;
                document.getElementById('thankMessage').innerText = `Your message has been sent successfully. We will contact you soon.`;
            }

            // After redirecting to thank-you page or successful submission
            sessionStorage.removeItem("isSubmitted");
            // Clear sessionStorage
            sessionStorage.clear();

            // Close button functionality
            document.getElementById('closeBtn').addEventListener('click', function (e) {
                e.preventDefault();

                if (window.opener || window.open('', '_self')) {
                    window.close(); // Works if allowed
                } else {
                    window.location.href = '/'; // Fallback for mobile
                } 

            });
        });
    </script>
</body>
</html>
